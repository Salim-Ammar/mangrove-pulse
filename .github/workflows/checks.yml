name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install software-test dependency
        run: python -m pip install numpy==2.1.3
      - name: Check payload integrity, Python syntax and notebook structure
        run: |
          python - <<'PY'
          import ast, json, sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from run_submission import verify_manifest
          manifest = verify_manifest(Path('.'))
          notebooks = 0
          for name in manifest:
              path = Path(name)
              if path.suffix == '.py':
                  ast.parse(path.read_text(encoding='utf-8'), filename=name)
              elif path.suffix == '.ipynb':
                  notebook = json.loads(path.read_text(encoding='utf-8'))
                  assert notebook['nbformat'] == 4 and isinstance(notebook['cells'], list), name
                  notebooks += 1
          print(f'Verified {len(manifest)} payload hashes and {notebooks} notebook structures.')
          PY
      - name: Run software tests
        run: python -m unittest discover -s tests -v
